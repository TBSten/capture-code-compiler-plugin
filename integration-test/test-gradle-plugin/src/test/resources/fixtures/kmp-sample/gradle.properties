# TestKit fixture 用の JVM 設定。
#
# task-152: この fixture は TestKit (`GradleRunner`) から **子 Gradle daemon** として起動される。
# ここに gradle.properties が無いと子 daemon は Gradle の default (heap 512 MiB /
# metaspace 384 MiB) で動くが、 Kotlin compiler + CaptureCode plugin (+ kmp-sample では KSP)
# のクラスロードで metaspace が枯渇し、 build が
#
#   The Daemon will expire after the build after running out of JVM Metaspace.
#   e: [ksp] java.lang.OutOfMemoryError: Metaspace
#
# で落ちる。 枯渇した瞬間に走っていた test が UnexpectedBuildFailure になるため、
# 失敗する test 名が実行ごとに変わる (KmpE2eTest / DslOptionsE2eTest / ...) 質の悪い flake になる。
# ローカルで恒常的に再現し、 CI でも Gradle build cache が cold な cell で発生した。
#
# 親 build (repo root の gradle.properties) は -Xmx4G を使うが、 子 daemon は
# 親と **同時に** 生きるため、 CI runner のメモリを圧迫しない範囲に抑えている。
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=768m
